[theme]
# Palette inspirée de l'identité SNCF, la même que PALETTE dans
# railinsight/viz/charts.py : carmillon pour les accents, bleu nuit pour le texte.
primaryColor = "#e05206"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f4f7"
textColor = "#1d2b4f"
font = "sans serif"

[client]
showErrorDetails = true

[logger]
level = "info"
