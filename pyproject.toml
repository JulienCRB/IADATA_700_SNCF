[project]
name = "iadata-700-projet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "pandas>=3.0.6",
    "pip>=26.2.1",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "squarify>=0.4.5",
    "streamlit>=1.28.0",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "railinsight"
module-root = ""

[dependency-groups]
# The `dev` group contains development dependencies.
# `uv sync` installs this group by default, so CI gets
# these tools automatically.
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
